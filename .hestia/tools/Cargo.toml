[workspace]
resolver = "2"
members = [
    # Conductor daemons (9)
    "conductors/hestia-ai-conductor",
    "conductors/hestia-rtl-conductor",
    "conductors/hestia-fpga-conductor",
    "conductors/hestia-asic-conductor",
    "conductors/hestia-pcb-conductor",
    "conductors/hestia-hal-conductor",
    "conductors/hestia-apps-conductor",
    "conductors/hestia-debug-conductor",
    "conductors/hestia-rag-conductor",
    # CLI clients (10)
    "clis/hestia",
    "clis/hestia-ai-cli",
    "clis/hestia-rtl-cli",
    "clis/hestia-fpga-cli",
    "clis/hestia-asic-cli",
    "clis/hestia-pcb-cli",
    "clis/hestia-hal-cli",
    "clis/hestia-apps-cli",
    "clis/hestia-debug-cli",
    "clis/hestia-rag-cli",
    # Phase 113: Claude Code wrapper shim (Plan C)
    "clis/claude-cli-shim",
    # Common crates (4)
    "crates/conductor-sdk",
    "crates/adapter-core",
    "crates/project-model",
    "crates/hestia-mcp-server",
    # Shared services layer (6)
    "crates/hdl-lsp-broker",
    "crates/waveform-core",
    "crates/constraint-bridge",
    "crates/ip-manager",
    "crates/cicd-api",
    "crates/observability",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
# Error handling
thiserror = "1"
anyhow = "1"
# CLI
clap = { version = "4", features = ["derive"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Persistence
sled = "0.34"
# Templates
minijinja = "2"
# DAG
petgraph = "0.6"
# Async traits
async-trait = "0.1"
# Date/time
chrono = { version = "0.4", features = ["serde"] }
# UUID
uuid = { version = "1", features = ["v4", "serde"] }
# Regex
regex = "1"
# Process management
command-group = "2"
# Home directory
dirs = "5"
# POSIX API (FIFO)
libc = "0.2"
# Internal crates
conductor-sdk = { path = "crates/conductor-sdk" }
adapter-core = { path = "crates/adapter-core" }
project-model = { path = "crates/project-model" }